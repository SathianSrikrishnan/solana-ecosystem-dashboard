name: Refresh Solana reports

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: report-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate reports
        run: python scripts/generate.py

      - name: Commit changed reports
        shell: bash
        run: |
          if git diff --quiet -- output; then
            echo "No report changes."
            exit 0
          fi
          git config user.name "solana-observatory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output
          git commit -m "data: refresh Solana network snapshot"
          git push
