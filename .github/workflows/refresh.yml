name: Refresh Solana reports

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: report-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install accessibility test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate reports
        run: python scripts/generate.py

      - name: Refresh economy metrics
        run: python scripts/refresh_economy.py --snapshot output/report.json --output output

      - name: Refresh ecosystem metrics
        run: python scripts/refresh_ecosystem.py --snapshot output/report.json --output output

      - name: Refresh official news and upgrades
        run: python scripts/refresh_updates.py --snapshot output/report.json --output output

      - name: Refresh Dune adoption metrics when configured
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python scripts/refresh_dune.py --snapshot output/report.json --output output

      - name: Run Axe accessibility checks
        shell: bash
        run: |
          python -m http.server 8766 --directory output &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          A11Y_URL=http://127.0.0.1:8766/index.html npm run test:a11y

      - name: Commit changed reports
        shell: bash
        run: |
          if git diff --quiet -- output; then
            echo "No report changes."
            exit 0
          fi
          git config user.name "solana-observatory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output
          git commit -m "data: refresh Solana network snapshot"
          git push
