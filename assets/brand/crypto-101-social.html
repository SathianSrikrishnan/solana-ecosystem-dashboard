<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { position: relative; background: #0a0907; color: #f1e8d5; font-family: "Palatino Linotype", Palatino, serif; }
    .art { position: absolute; inset: 0; width: 1200px; height: 630px; object-fit: cover; object-position: center; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,9,7,.98) 0%, rgba(10,9,7,.94) 31%, rgba(10,9,7,.58) 52%, rgba(10,9,7,.08) 78%); }
    .grid { position: absolute; inset: 0; opacity: .36; background-image: linear-gradient(rgba(200,154,67,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(200,154,67,.08) 1px, transparent 1px); background-size: 48px 48px; }
    main { position: relative; z-index: 1; width: 690px; height: 100%; padding: 48px 58px 42px; display: flex; flex-direction: column; }
    .brand { color: #65d4d0; font: 700 13px/1 Bahnschrift, sans-serif; letter-spacing: .13em; text-transform: uppercase; }
    .kicker { margin-top: 82px; color: #c89a43; font: 700 13px/1 Bahnschrift, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 14px 0 18px; font-size: 72px; line-height: .86; font-weight: 500; letter-spacing: -.05em; }
    h1 em { color: #c89a43; font-weight: 500; }
    .deck { width: 535px; margin: 0; color: #d0c5b0; font-size: 21px; line-height: 1.36; }
    footer { margin-top: auto; color: #a69b87; font: 700 12px/1 Bahnschrift, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  </style>
</head>
<body>
  <img class="art" src="../../output/media/flagship-hero.png" alt="">
  <div class="shade"></div>
  <div class="grid"></div>
  <main>
    <div class="brand">A working framework for the agentic age</div>
    <div class="kicker">Knowledge · prosperity · verifiable truth</div>
    <h1>Saraswati, Lakshmi,<br><em>and the Ledger</em></h1>
    <p class="deck">Two ancient questions for intelligence, programmable value, and what deserves to be built next.</p>
    <footer>Sathian Srikrishnan · Toronto</footer>
  </main>
</body>
</html>
