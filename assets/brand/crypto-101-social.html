<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { position: relative; background: #080806; color: #f2ead8; font-family: "Palatino Linotype", Palatino, serif; }
    .art { position: absolute; inset: 0 0 0 470px; width: 730px; height: 630px; object-fit: cover; object-position: 55% center; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #080806 0%, #080806 34%, rgba(8,8,6,.91) 44%, rgba(8,8,6,.08) 83%); }
    .grid { position: absolute; inset: 0; opacity: .42; background-image: linear-gradient(rgba(199,149,63,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(199,149,63,.07) 1px, transparent 1px); background-size: 48px 48px; }
    main { position: relative; z-index: 1; width: 660px; height: 100%; padding: 54px 62px 48px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 12px; color: #6ce5dc; font: 700 14px/1 Bahnschrift, sans-serif; letter-spacing: .13em; text-transform: uppercase; }
    .brand img { width: 30px; height: 25px; }
    .kicker { margin-top: 76px; color: #c7953f; font: 700 14px/1 Bahnschrift, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 16px 0 20px; font-size: 86px; line-height: .86; font-weight: 500; letter-spacing: -.055em; }
    .deck { width: 530px; margin: 0; color: #c9c0ad; font-size: 23px; line-height: 1.36; }
    footer { margin-top: auto; color: #a79d89; font: 700 13px/1 Bahnschrift, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  </style>
</head>
<body>
  <img class="art" src="../../output/media/crypto-101-balance.png" alt="">
  <div class="shade"></div>
  <div class="grid"></div>
  <main>
    <div class="brand"><img src="solana-logomark.svg" alt=""> Crypto 101 / Field Note 01</div>
    <div class="kicker">Knowledge · prosperity · verifiable truth</div>
    <h1>Two Kinds<br>of Power</h1>
    <p class="deck">What Saraswati, Lakshmi, public ledgers, and two daughters taught me about programmable money.</p>
    <footer>Sathian Srikrishnan · Toronto</footer>
  </main>
</body>
</html>
