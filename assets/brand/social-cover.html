<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { position: relative; background: #070a0e; color: #f0f5f3; font-family: "Segoe UI Variable", "Trebuchet MS", sans-serif; }
    .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,10,14,.98) 0%, rgba(7,10,14,.92) 42%, rgba(7,10,14,.18) 76%, rgba(7,10,14,.08) 100%); }
    .grid { position: absolute; inset: 0; opacity: .3; background-image: linear-gradient(rgba(77,240,168,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(77,240,168,.08) 1px, transparent 1px); background-size: 52px 52px; }
    main { position: relative; z-index: 1; width: 710px; height: 100%; padding: 54px 60px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 15px; color: #14f195; font: 700 18px/1 "Cascadia Mono", Consolas, monospace; letter-spacing: .13em; }
    .brand img { width: 38px; height: 31px; object-fit: contain; }
    .kicker { margin-top: 76px; color: #14f195; font: 700 16px/1.2 "Cascadia Mono", Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 18px 0 18px; max-width: 640px; font: 800 82px/.88 Bahnschrift, "Franklin Gothic Medium", sans-serif; letter-spacing: -.055em; }
    .deck { max-width: 565px; margin: 0; color: #c3ceca; font-size: 24px; line-height: 1.35; }
    footer { margin-top: auto; display: flex; gap: 30px; color: #96a6a1; font: 700 14px/1 "Cascadia Mono", Consolas, monospace; letter-spacing: .06em; }
    footer span::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 9px; border: 1px solid #14f195; transform: rotate(45deg); }
    .credit { position: absolute; right: 42px; bottom: 34px; color: rgba(240,245,243,.7); font: 13px/1.2 "Cascadia Mono", Consolas, monospace; }
  </style>
</head>
<body>
  <img class="art" src="observatory-rails-background.png" alt="">
  <div class="shade"></div>
  <div class="grid"></div>
  <main>
    <div class="brand"><img src="solana-logomark.svg" alt=""> SOLANA OBSERVATORY</div>
    <div class="kicker">Ecosystem dashboard</div>
    <h1>Solana,<br>without the fog.</h1>
    <p class="deck">Six questions. One living system.<br>Every claim inspectable.</p>
    <footer><span>LIVE</span><span>AUTO-UPDATING</span><span>SOURCE-VISIBLE</span></footer>
  </main>
  <div class="credit">Built by Sathian Srikrishnan</div>
</body>
</html>
